<!--
  Wix → Embed → Website / HTML iframe bileşenine yapıştırın.
  URL’yi kendi Railway adresinizle değiştirin.
  Bölümü Editörde “Stretch” / tam genişlik yapın; yükseklik için min-height kritik.
-->
<div
  style="
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    background: #141214;
    margin: 0;
    padding: 0;
    line-height: 0;
  "
>
  <iframe
    src="https://silerchefapi-production.up.railway.app/"
    title="Siler Chef"
    style="
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      height: 100%;
      border: 0;
      display: block;
      vertical-align: top;
    "
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="fullscreen"
  ></iframe>
</div>
