<!--
  Wix → Embed → Website / HTML iframe
  1) Bu bloğu yapıştırın. 2) Bölümü tam genişlik yapın.
  3) iframe'e sabit yükseklik şart — Wix çoğu zaman %100 yüksekliği vermez (ekran siyah kalır).
-->
<div
  style="
    width: 100%;
    min-height: 5000px;
    background: #141214;
    margin: 0;
    padding: 0;
    line-height: 0;
  "
>
  <iframe
    src="https://silerchefapi-production.up.railway.app/?embed=1"
    title="Siler Chef"
    width="100%"
    height="5000"
    style="
      width: 100%;
      min-height: 5000px;
      height: 5000px;
      max-width: 100%;
      border: 0;
      display: block;
    "
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="fullscreen"
  ></iframe>
</div>
